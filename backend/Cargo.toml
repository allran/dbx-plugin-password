[package]
name = "dbx-plugin-password"
version = "0.3.3"
edition = "2021"
license = "Apache-2.0"

[workspace]

[dependencies]
aes-gcm = "0.11"
argon2 = "0.6"
base64 = "0.22"
dbx-plugin-sdk = { version = "0.1.0" }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

# Keep plugin binaries close to the host app's size: default release settings
# leave ~20MB of symbols and unoptimized generic code in an OpenDAL-sized backend.
# panic stays "unwind" so the sidecar protocol can report panics as errors.
[profile.release]
strip = true
lto = true
codegen-units = 1
